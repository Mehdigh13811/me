name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Remote Desktop & Configure Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set Admin Password for runneradmin
        shell: powershell
        run: |
          net user runneradmin "WindowsRDP#2025"

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $out = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -FilePath $out -ArgumentList "/quiet" -Wait

      - name: Connect to Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.key }}
        run: |
          $ErrorActionPreference = "Stop"
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TS_AUTHKEY --accept-routes --accept-dns

      - name: Display RDP Connection Details and Keep Alive
        shell: powershell
        run: |
          $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "================"
          Write-Host "RDP IS READY"
          Write-Host "================"
          Write-Host "IP Address: $tsIP"
          Write-Host "Username  : runneradmin"
          Write-Host "Password  : WindowsRDP#2025"
          Write-Host "================"
          Write-Host "Connect via Remote Desktop client using the IP above."
          Write-Host "Session will terminate automatically after 3 minutes."
          Write-Host "================"

          # زنده نگه داشتن سشن تا پایان تایم‌اوت
          Start-Sleep -Seconds 180
