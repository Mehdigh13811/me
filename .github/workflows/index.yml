name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Remote Desktop & Configure Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set Admin Password for runneradmin
        shell: powershell
        run: |
          net user runneradmin "WindowsRDP#2025"

      - name: Customize Desktop Icons
        shell: powershell
        run: |
          # مخفی کردن تمام آیکون‌های دسکتاپ
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name "HideIcons" -Value 1

          # فقط This PC و Recycle Bin رو نمایش بده
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel' -Name "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" -Value 0
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel' -Name "{645FF040-5081-101B-9F08-00AA002F954E}" -Value 0

          # ساخت شورتکات Google Chrome روی دسکتاپ
          $WshShell = New-Object -ComObject WScript.Shell
          $Shortcut = $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\Google Chrome.lnk")
          $Shortcut.TargetPath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          $Shortcut.Save()

          # انتقال Recycle Bin به گوشه سمت راست پایین
          # (تنظیم موقعیت آیکون‌ها از طریق رجیستری ممکن نیست، پس از روش جایگزین استفاده می‌کنیم)
          $desktopPath = "$env:USERPROFILE\Desktop"
          $recycleBinPath = "$env:USERPROFILE\Desktop\Recycle Bin"
          # ایجاد یک شورتکات به Recycle Bin
          $WshShell = New-Object -ComObject WScript.Shell
          $Shortcut = $WshShell.CreateShortcut("$desktopPath\Recycle Bin.lnk")
          $Shortcut.TargetPath = "explorer.exe"
          $Shortcut.Arguments = "shell:RecycleBinFolder"
          $Shortcut.Save()

          # راه‌اندازی مجدد Explorer برای اعمال تغییرات
          Stop-Process -Name explorer -Force
          Start-Sleep -Seconds 2

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $out = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -FilePath $out -ArgumentList "/quiet" -Wait

      - name: Connect to Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.key }}
        run: |
          $ErrorActionPreference = "Stop"
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TS_AUTHKEY --accept-routes --accept-dns

      - name: Display RDP Connection Details and Keep Alive
        shell: powershell
        run: |
          $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "================"
          Write-Host "RDP IS READY"
          Write-Host "================"
          Write-Host "IP Address: $tsIP"
          Write-Host "Username  : runneradmin"
          Write-Host "Password  : WindowsRDP#2025"
          Write-Host "================"
          Write-Host "Connect via Remote Desktop client using the IP above."
          Write-Host "Session will terminate automatically after 3 minutes."
          Write-Host "================"
          Start-Sleep -Seconds 180
