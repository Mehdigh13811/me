name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test FTP Connection
        shell: powershell
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          $ftpUrl = "ftp://$env:FTP_SERVER/"
          $output = curl.exe -s -S --connect-timeout 15 --max-time 30 --user "$env:FTP_USERNAME`:$env:FTP_PASSWORD" $ftpUrl 2>&1 | Out-String
          Write-Host "FTP Test Output: $output"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::FTP connection failed with exit code $LASTEXITCODE. Cancelling workflow."
              exit 1
          }
          Write-Host "FTP connection successful."

      - name: Enable Remote Desktop & Configure Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set Admin Password for runneradmin
        shell: powershell
        run: |
          net user runneradmin "WindowsRDP#2025"

      - name: Customize Desktop Icons via Registry
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel'
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          Set-ItemProperty -Path $key -Name "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" -Value 0 -Type DWord
          Set-ItemProperty -Path $key -Name "{645FF040-5081-101B-9F08-00AA002F954E}" -Value 0 -Type DWord
          Set-ItemProperty -Path $key -Name "{59031a47-3f72-44a7-89c5-5595fe6b30ee}" -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name "{F02C1A0D-BE21-4350-88B0-7367FC96EF3C}" -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name "{5399E694-6CE5-4D6C-8FCE-1D8870FDCBA0}" -Value 1 -Type DWord
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name "HideIcons" -Value 0 -Type DWord

      - name: Remove Unwanted Desktop Shortcuts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $desktop = "$env:USERPROFILE\Desktop"
          $publicDesktop = "C:\Users\Public\Desktop"
          $unwanted = @("Firefox.lnk","Microsoft Edge.lnk","R 4.6.1.lnk","Unity Hub.lnk","Google Chrome.lnk")
          foreach ($folder in @($desktop, $publicDesktop)) {
              if (Test-Path $folder) {
                  foreach ($item in $unwanted) {
                      $path = Join-Path $folder $item
                      if (Test-Path $path) { Remove-Item -Path $path -Force }
                  }
              }
          }
          $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (Test-Path $chromePath) {
              $WshShell = New-Object -ComObject WScript.Shell
              $Shortcut = $WshShell.CreateShortcut("$desktop\Google Chrome.lnk")
              $Shortcut.TargetPath = $chromePath
              $Shortcut.Save()
          }

      - name: Restore Telegram Backup from FTP
        shell: powershell
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          $telegramDir = "C:\Telegram"
          $zipPath = "$env:TEMP\telegram-backup.zip"
          $ftpUrl = "ftp://$env:FTP_SERVER/telegram-backup.zip"

          Write-Host "Attempting to download backup from FTP..."
          curl.exe -s -S --connect-timeout 15 --max-time 300 --user "$env:FTP_USERNAME`:$env:FTP_PASSWORD" -o $zipPath $ftpUrl

          if ((Test-Path $zipPath) -and ((Get-Item $zipPath).Length -gt 0)) {
              Write-Host "Backup found. Extracting..."
              if (Test-Path $telegramDir) { Remove-Item -Path $telegramDir -Recurse -Force }
              New-Item -Path $telegramDir -ItemType Directory -Force | Out-Null
              Expand-Archive -Path $zipPath -DestinationPath $telegramDir -Force
              Remove-Item -Path $zipPath -Force
              Write-Host "Telegram restored from FTP backup."
          } else {
              Write-Host "No existing backup found on FTP. Will download fresh Telegram."
              if (Test-Path $zipPath) { Remove-Item -Path $zipPath -Force }
          }

      - name: Setup Telegram Portable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $telegramDir = "C:\Telegram"

          if (-not (Test-Path "$telegramDir\Telegram.exe")) {
              Write-Host "Downloading fresh Telegram Portable..."
              $url = "https://telegram.org/dl/desktop/win64_portable"
              $out = "$env:TEMP\telegram.zip"
              Invoke-WebRequest -Uri $url -OutFile $out
              if (-not (Test-Path $telegramDir)) { New-Item -Path $telegramDir -ItemType Directory -Force }
              Expand-Archive -Path $out -DestinationPath $telegramDir -Force
              Remove-Item -Path $out -Force
              Write-Host "Telegram extracted to $telegramDir"
          } else {
              Write-Host "Telegram already present."
          }

      - name: Create Telegram Desktop Shortcut
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $desktop = "$env:USERPROFILE\Desktop"
          $telegramExe = "C:\Telegram\Telegram.exe"
          if (Test-Path $telegramExe) {
              $WshShell = New-Object -ComObject WScript.Shell
              $Shortcut = $WshShell.CreateShortcut("$desktop\Telegram.lnk")
              $Shortcut.TargetPath = $telegramExe
              $Shortcut.WorkingDirectory = "C:\Telegram"
              $Shortcut.Save()
              Write-Host "Telegram shortcut created."
          }

      - name: Restart Explorer to Apply Changes
        shell: powershell
        run: |
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          if (-not (Get-Process -Name explorer -ErrorAction SilentlyContinue)) { Start-Process explorer.exe }

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $out = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -FilePath $out -ArgumentList "/quiet" -Wait

      - name: Connect to Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.key }}
        run: |
          $ErrorActionPreference = "Stop"
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TS_AUTHKEY --accept-routes --accept-dns

      - name: Display RDP Connection Details and Keep Alive
        shell: powershell
        run: |
          $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "================"
          Write-Host "RDP IS READY"
          Write-Host "================"
          Write-Host "IP Address: $tsIP"
          Write-Host "Username  : runneradmin"
          Write-Host "Password  : WindowsRDP#2025"
          Write-Host "================"
          Write-Host "Connect via Remote Desktop client using the IP above."
          Write-Host "================"
          Start-Sleep -Seconds 300

      - name: Backup Telegram to FTP
        if: always()
        shell: powershell
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          $telegramDir = "C:\Telegram"
          $zipPath = "$env:TEMP\telegram-backup.zip"

          if (-not (Test-Path $telegramDir)) {
              Write-Host "No Telegram folder found. Skipping backup."
              exit 0
          }

          Get-Process -Name "Telegram" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3

          if (Test-Path $zipPath) { Remove-Item -Path $zipPath -Force }

          Write-Host "Compressing Telegram folder..."
          Compress-Archive -Path "$telegramDir\*" -DestinationPath $zipPath -Force

          $zipSizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "Backup size: $zipSizeMB MB"

          $ftpUrl = "ftp://$env:FTP_SERVER/telegram-backup.zip"
          Write-Host "Uploading to FTP (overwriting existing file)..."
          curl.exe -s -S --connect-timeout 15 --max-time 600 --user "$env:FTP_USERNAME`:$env:FTP_PASSWORD" -T $zipPath $ftpUrl

          if ($LASTEXITCODE -eq 0) {
              Write-Host "Backup uploaded successfully. File overwritten on FTP."
          } else {
              Write-Host "FTP upload failed with exit code $LASTEXITCODE"
          }

          Remove-Item -Path $zipPath -Force -ErrorAction SilentlyContinue
