name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test FTP Connection
        shell: powershell
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          $ftpUrl = "ftp://$env:FTP_SERVER/"
          $output = curl.exe -s -S --connect-timeout 15 --max-time 30 --user "$env:FTP_USERNAME`:$env:FTP_PASSWORD" $ftpUrl 2>&1 | Out-String
          Write-Host "FTP Test Output: $output"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::FTP connection failed with exit code $LASTEXITCODE. Cancelling workflow."
              exit 1
          }
          Write-Host "FTP connection successful."

      - name: Enable Remote Desktop & Configure Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set Admin Password for runneradmin
        shell: powershell
        run: |
          net user runneradmin "WindowsRDP#2025"

      - name: Customize Desktop Icons via Registry
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel'
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          Set-ItemProperty -Path $key -Name "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" -Value 0 -Type DWord
          Set-ItemProperty -Path $key -Name "{645FF040-5081-101B-9F08-00AA002F954E}" -Value 0 -Type DWord
          Set-ItemProperty -Path $key -Name "{59031a47-3f72-44a7-89c5-5595fe6b30ee}" -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name "{F02C1A0D-BE21-4350-88B0-7367FC96EF3C}" -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name "{5399E694-6CE5-4D6C-8FCE-1D8870FDCBA0}" -Value 1 -Type DWord
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name "HideIcons" -Value 0 -Type DWord

      - name: Remove Unwanted Desktop Shortcuts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $desktop = "$env:USERPROFILE\Desktop"
          $publicDesktop = "C:\Users\Public\Desktop"
          $unwanted = @("Firefox.lnk","Microsoft Edge.lnk","R 4.6.1.lnk","Unity Hub.lnk","Google Chrome.lnk")
          foreach ($folder in @($desktop, $publicDesktop)) {
              if (Test-Path $folder) {
                  foreach ($item in $unwanted) {
                      $path = Join-Path $folder $item
                      if (Test-Path $path) { Remove-Item -Path $path -Force }
                  }
              }
          }
          $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (Test-Path $chromePath) {
              $WshShell = New-Object -ComObject WScript.Shell
              $Shortcut = $WshShell.CreateShortcut("$desktop\Google Chrome.lnk")
              $Shortcut.TargetPath = $chromePath
              $Shortcut.Save()
          }

      - name: Download Telegram Portable from FTP
        shell: powershell
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          $telegramDir = "C:\Telegram"
          $zipPath = "$env:TEMP\tel.zip"
          $ftpUrl = "ftp://$env:FTP_SERVER/tel.zip"

          Write-Host "Downloading Telegram from: $ftpUrl"
          curl.exe -s -S --connect-timeout 15 --max-time 600 --user "$env:FTP_USERNAME`:$env:FTP_PASSWORD" -o $zipPath $ftpUrl

          if ((Test-Path $zipPath) -and ((Get-Item $zipPath).Length -gt 1000000)) {
              Write-Host "Downloaded. Size: $([math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB"
              if (Test-Path $telegramDir) { Remove-Item -Path $telegramDir -Recurse -Force }
              New-Item -Path $telegramDir -ItemType Directory -Force | Out-Null
              Expand-Archive -Path $zipPath -DestinationPath $telegramDir -Force
              Remove-Item -Path $zipPath -Force
              Write-Host "Telegram extracted to $telegramDir"
          } else {
              Write-Host "::error::Failed to download tel.zip from FTP root."
              exit 1
          }

      - name: Find and Normalize Telegram Path
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $telegramDir = "C:\Telegram"

          $exe = Get-ChildItem -Path $telegramDir -Filter "Telegram.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($null -eq $exe) {
              Write-Host "::error::Telegram.exe not found anywhere under C:\Telegram"
              exit 1
          }

          $rootExe = Join-Path $telegramDir "Telegram.exe"
          if ($exe.FullName -ne $rootExe) {
              Get-ChildItem -Path $exe.Directory.FullName -Force | ForEach-Object {
                  $dest = Join-Path $telegramDir $_.Name
                  if (Test-Path $dest) { Remove-Item -Path $dest -Recurse -Force }
                  Move-Item -Path $_.FullName -Destination $dest -Force
              }
          }

          if (Test-Path "$telegramDir\Telegram.exe") {
              Write-Host "Telegram.exe is at correct location: $telegramDir\Telegram.exe"
          } else {
              Write-Host "::error::Failed to place Telegram.exe at $telegramDir"
              exit 1
          }

      - name: Restore Tdata from FTP if Exists
        shell: powershell
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          $telegramDir = "C:\Telegram"
          $tdataDir = "$telegramDir\tdata"
          $tdataZip = "$env:TEMP\tdata-backup.zip"
          $ftpUrl = "ftp://$env:FTP_SERVER/tdata-backup.zip"

          curl.exe -s -S --connect-timeout 15 --max-time 300 --user "$env:FTP_USERNAME`:$env:FTP_PASSWORD" -o $tdataZip $ftpUrl 2>&1 | Out-Null

          if ((Test-Path $tdataZip) -and ((Get-Item $tdataZip).Length -gt 1000)) {
              if (Test-Path $tdataDir) { Remove-Item -Path $tdataDir -Recurse -Force }
              Expand-Archive -Path $tdataZip -DestinationPath $tdataDir -Force
              Remove-Item -Path $tdataZip -Force
              Write-Host "Tdata restored successfully. Login will be preserved."
          } else {
              Write-Host "No Tdata backup found. Fresh Telegram will start."
              if (Test-Path $tdataZip) { Remove-Item -Path $tdataZip -Force }
          }

          exit 0

      - name: Restore Desktop from FTP if Exists
        shell: powershell
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          $desktopDir = "$env:USERPROFILE\Desktop"
          $desktopZip = "$env:TEMP\desktop-backup.zip"
          $ftpUrl = "ftp://$env:FTP_SERVER/desktop-backup.zip"

          curl.exe -s -S --connect-timeout 15 --max-time 300 --user "$env:FTP_USERNAME`:$env:FTP_PASSWORD" -o $desktopZip $ftpUrl 2>&1 | Out-Null

          if ((Test-Path $desktopZip) -and ((Get-Item $desktopZip).Length -gt 100)) {
              $tempExtract = "$env:TEMP\desktop-restore"
              if (Test-Path $tempExtract) { Remove-Item -Path $tempExtract -Recurse -Force }
              New-Item -Path $tempExtract -ItemType Directory -Force | Out-Null
              Expand-Archive -Path $desktopZip -DestinationPath $tempExtract -Force

              Get-ChildItem -Path $tempExtract -Force | ForEach-Object {
                  $dest = Join-Path $desktopDir $_.Name
                  Move-Item -Path $_.FullName -Destination $dest -Force
              }

              Remove-Item -Path $tempExtract -Recurse -Force
              Remove-Item -Path $desktopZip -Force
              Write-Host "Desktop restored successfully."
          } else {
              Write-Host "No Desktop backup found. Continuing with default desktop."
              if (Test-Path $desktopZip) { Remove-Item -Path $desktopZip -Force }
          }

          exit 0

      - name: Create Telegram Desktop Shortcut
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $userDesktop = "$env:USERPROFILE\Desktop"
          $publicDesktop = "C:\Users\Public\Desktop"
          $telegramExe = "C:\Telegram\Telegram.exe"

          Get-ChildItem -Path $userDesktop -Filter "*elegram*.lnk" -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem -Path $publicDesktop -Filter "*elegram*.lnk" -ErrorAction SilentlyContinue | Remove-Item -Force

          if (Test-Path $telegramExe) {
              $WshShell = New-Object -ComObject WScript.Shell
              $Shortcut = $WshShell.CreateShortcut("$publicDesktop\Telegram.lnk")
              $Shortcut.TargetPath = $telegramExe
              $Shortcut.WorkingDirectory = "C:\Telegram"
              $Shortcut.Save()
              Write-Host "Telegram shortcut created on Public Desktop."
          } else {
              Write-Host "::error::Telegram.exe not found at $telegramExe"
              exit 1
          }

      - name: Restart Explorer to Apply Changes
        shell: powershell
        run: |
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          if (-not (Get-Process -Name explorer -ErrorAction SilentlyContinue)) { Start-Process explorer.exe }

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $out = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -FilePath $out -ArgumentList "/quiet" -Wait

      - name: Connect to Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.key }}
        run: |
          $ErrorActionPreference = "Stop"
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TS_AUTHKEY --accept-routes --accept-dns

      - name: Server Ready
        shell: powershell
        run: |
          $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          $separator = "=" * 60
          Write-Host ""
          Write-Host $separator -ForegroundColor Cyan
          Write-Host "  WINDOWS RDP SERVER IS READY" -ForegroundColor Green
          Write-Host $separator -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  IP Address  : " -NoNewline -ForegroundColor Yellow
          Write-Host $tsIP -ForegroundColor White
          Write-Host "  Username    : " -NoNewline -ForegroundColor Yellow
          Write-Host "runneradmin" -ForegroundColor White
          Write-Host "  Password    : " -NoNewline -ForegroundColor Yellow
          Write-Host "WindowsRDP#2025" -ForegroundColor White
          Write-Host ""
          Write-Host $separator -ForegroundColor Cyan
          Write-Host "  Connect using Remote Desktop client with the IP above." -ForegroundColor Gray
          Write-Host "  Session will remain active for 2 minutes (test mode)." -ForegroundColor Gray
          Write-Host $separator -ForegroundColor Cyan
          Write-Host ""
          Start-Sleep -Seconds 120

      - name: Backup Tdata to FTP
        if: always()
        shell: powershell
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          $tdataDir = "C:\Telegram\tdata"
          $zipPath = "$env:TEMP\tdata-backup.zip"

          if (-not (Test-Path $tdataDir)) {
              Write-Host "No Tdata folder found. Skipping backup."
              exit 0
          }

          Get-Process -Name "Telegram" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3

          if (Test-Path $zipPath) { Remove-Item -Path $zipPath -Force }

          Compress-Archive -Path "$tdataDir\*" -DestinationPath $zipPath -Force

          $zipSizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "Tdata backup size: $zipSizeMB MB"

          $ftpUrl = "ftp://$env:FTP_SERVER/tdata-backup.zip"
          curl.exe -s -S --connect-timeout 15 --max-time 600 --user "$env:FTP_USERNAME`:$env:FTP_PASSWORD" -T $zipPath $ftpUrl

          if ($LASTEXITCODE -eq 0) {
              Write-Host "Tdata backup uploaded successfully."
          } else {
              Write-Host "FTP upload failed with exit code $LASTEXITCODE"
          }

          Remove-Item -Path $zipPath -Force -ErrorAction SilentlyContinue
          exit 0

      - name: Backup Desktop to FTP
        if: always()
        shell: powershell
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          $desktopDir = "$env:USERPROFILE\Desktop"
          $publicDesktop = "C:\Users\Public\Desktop"
          $stagingDir = "$env:TEMP\desktop-backup-staging"
          $zipPath = "$env:TEMP\desktop-backup.zip"

          if (-not (Test-Path $desktopDir)) {
              Write-Host "No Desktop folder found. Skipping desktop backup."
              exit 0
          }

          if (Test-Path $stagingDir) { Remove-Item -Path $stagingDir -Recurse -Force }
          New-Item -Path $stagingDir -ItemType Directory -Force | Out-Null

          Get-ChildItem -Path $desktopDir -Force | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination $stagingDir -Recurse -Force
          }

          if (Test-Path $publicDesktop) {
              Get-ChildItem -Path $publicDesktop -Force | ForEach-Object {
                  $dest = Join-Path $stagingDir $_.Name
                  if (-not (Test-Path $dest)) {
                      Copy-Item -Path $_.FullName -Destination $dest -Recurse -Force
                  }
              }
          }

          if (Test-Path $zipPath) { Remove-Item -Path $zipPath -Force }

          Compress-Archive -Path "$stagingDir\*" -DestinationPath $zipPath -Force

          $zipSizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "Desktop backup size: $zipSizeMB MB"

          $ftpUrl = "ftp://$env:FTP_SERVER/desktop-backup.zip"
          curl.exe -s -S --connect-timeout 15 --max-time 600 --user "$env:FTP_USERNAME`:$env:FTP_PASSWORD" -T $zipPath $ftpUrl

          if ($LASTEXITCODE -eq 0) {
              Write-Host "Desktop backup uploaded successfully."
          } else {
              Write-Host "FTP upload failed with exit code $LASTEXITCODE"
          }

          Remove-Item -Path $stagingDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $zipPath -Force -ErrorAction SilentlyContinue
          exit 0
